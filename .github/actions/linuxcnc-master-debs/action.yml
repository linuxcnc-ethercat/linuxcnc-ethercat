---
name: Build and install linuxcnc 2.10 debs
description: >-
  Build linuxcnc (2.10 pre-release, uspace) from source as Debian packages,
  cache them by upstream commit, and install linuxcnc-uspace and
  linuxcnc-uspace-dev into the build container. Used to compile
  linuxcnc-ethercat against the new HAL getter/setter API, which no public
  apt repository carries yet. The ref input selects the upstream commit:
  CI builds master (early warning for the next HAL break), the release
  workflow pins a tag for reproducible debs.
inputs:
  codename:
    description: Debian codename (bookworm, trixie)
    required: true
  distro:
    description: Matrix distro label, used in the cache key
    required: true
  arch:
    description: >-
      Matrix arch label (amd64, arm64), used in the cache key. Cached debs
      are arch-specific, so amd64 and arm64 builds must never share a key.
    required: false
    default: amd64
  ref:
    description: >-
      Upstream linuxcnc git ref (tag, branch or commit) to build. CI leaves
      this at the default (master) so a future upstream HAL break shows up
      as a failing scheduled run - early warning. The release workflow pins
      a tag so published debs are reproducible.
    required: false
    default: master

runs:
  using: composite
  steps:
    - name: Install build tooling
      shell: bash
      env:
          DEBIAN_FRONTEND: noninteractive
      run: |
          set -e
          echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y --no-install-recommends \
              ca-certificates curl git build-essential devscripts debhelper equivs

    - name: Resolve linuxcnc commit
      id: sha
      shell: bash
      env:
          REF: ${{ inputs.ref }}
      run: |
          set -e
          # Try tag/branch first, then a raw commit SHA.
          sha=$(git ls-remote https://github.com/LinuxCNC/linuxcnc.git "refs/tags/${REF}^{}" "refs/tags/${REF}" "refs/heads/${REF}" "${REF}" \
                  | head -1 | cut -f1)
          if [ -z "${sha}" ]; then
              sha="${REF}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    - name: Cache linuxcnc 2.10 debs
      id: cache
      uses: actions/cache@v6
      with:
          path: linuxcnc-dist
          key: linuxcnc-master-debs-${{ inputs.distro }}-${{ inputs.arch }}-${{ steps.sha.outputs.sha }}

    - name: Build linuxcnc 2.10 debs
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
          DEBIAN_FRONTEND: noninteractive
          REF: ${{ inputs.ref }}
      run: |
          set -e
          git clone https://github.com/LinuxCNC/linuxcnc.git linuxcnc-master
          cd linuxcnc-master
          git fetch --depth 1 origin "${REF}"
          git checkout --detach FETCH_HEAD
          # no-docs: drop the documentation toolchain (asciidoctor-pdf,
          # fonts-noto-cjk, ...) from both the build-deps and the build.
          # We only need linuxcnc-uspace and linuxcnc-uspace-dev.
          (cd debian && ./configure no-docs)
          # Install the tree's own build-deps (the archive's linuxcnc 2.9.x
          # build-deps lag 2.10's debian/control, e.g. the pyqt5 stack).
          # mk-build-deps generates and installs a linuxcnc-build-deps
          # package from the generated control file.
          mk-build-deps --install --remove \
              --tool "apt-get -y --no-install-recommends" debian/control
          dpkg-buildpackage -B -us -uc -j"$(nproc)"
          mkdir -p ../linuxcnc-dist
          # dpkg-buildpackage drops the debs next to the source tree, i.e.
          # in the workspace root; move them aside so the later
          # linuxcnc-ethercat build (which scans ../*.deb) never sees them.
          mv ../*.deb ../linuxcnc-dist/

    - name: Install linuxcnc 2.10 debs
      shell: bash
      env:
          DEBIAN_FRONTEND: noninteractive
      run: |
          set -e
          apt-get install -y \
              ./linuxcnc-dist/linuxcnc-uspace_*.deb \
              ./linuxcnc-dist/linuxcnc-uspace-dev_*.deb
