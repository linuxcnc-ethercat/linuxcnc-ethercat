# Example: two Delta ASDA-B3-E drives (X, Y) on EtherCAT in CSP mode,
# homed by the drives themselves (hard stop, then back to the Z pulse).

[EMC]
MACHINE = Delta B3 homing test CSP
DEBUG   = 0
VERSION = 1.1

[DISPLAY]
DISPLAY                 = axis
CYCLE_TIME              = 0.100
POSITION_OFFSET         = RELATIVE
POSITION_FEEDBACK       = ACTUAL
MAX_FEED_OVERRIDE       = 2
DEFAULT_LINEAR_VELOCITY = 20.0
MIN_LINEAR_VELOCITY     = 0
MAX_LINEAR_VELOCITY     = 200.0
PROGRAM_PREFIX          = ~/linuxcnc/nc_files
# Do not load the AXIS splash program: it uses Z, which this XY machine lacks.
OPEN_FILE               = ""
INCREMENTS              = 1mm .1mm .01mm .001mm

[KINS]
JOINTS     = 2
KINEMATICS = trivkins coordinates=XY

[FILTER]
PROGRAM_EXTENSION = .nc,.ngc,.tap G-Code file

[TASK]
TASK       = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE        = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G94

[EMCMOT]
EMCMOT       = motmod
COMM_TIMEOUT = 1.0
# Bus cycle in ns.  Must equal appTimePeriod in ethercat-conf.xml.
SERVO_PERIOD = 1000000

[HAL]
HALFILE = deasdb3-homing-csp.hal
HALUI   = halui

[TRAJ]
COORDINATES             = X Y
LINEAR_UNITS            = mm
ANGULAR_UNITS           = degree
DEFAULT_LINEAR_VELOCITY = 20.0
MAX_LINEAR_VELOCITY     = 200.0

[EMCIO]
EMCIO      = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# ---------------------------------------------------------------------------
# Drive settings (read by the HAL file)
#
#   UNITS_PER_REV    machine units (mm) per motor revolution, here a 5 mm
#                    ball screw driven 1:1.  Negative reverses the direction.
#   HOME_SPEED_FAST  speed of the run onto the hard stop [0.1 rpm]
#   HOME_SPEED_SLOW  speed of the way back to the Z pulse [0.1 rpm]
#   HOME_ACCEL       time from 0 to 3000 rpm while homing [ms]
#   SW_LIMIT_MARGIN  how far the software limits of the drive are outside
#                    of the joint limits [mm]
#
# Resolution (500000 PUU per revolution), homing method and the hard stop
# torque level are in ethercat-conf.xml.
# ---------------------------------------------------------------------------

[DRIVE_X]
UNITS_PER_REV   = 5
HOME_SPEED_FAST = 300
HOME_SPEED_SLOW = 100
HOME_ACCEL      = 200
SW_LIMIT_MARGIN = 1

[DRIVE_Y]
UNITS_PER_REV   = 5
HOME_SPEED_FAST = 300
HOME_SPEED_SLOW = 100
HOME_ACCEL      = 200
SW_LIMIT_MARGIN = 1

# ---------------------------------------------------------------------------
# Joints
#
# The homing lines select LinuxCNC's "index only" homing:
#   HOME_SEARCH_VEL = 0, HOME_LATCH_VEL != 0, HOME_USE_INDEX = YES
# LinuxCNC then sets joint.N.index-enable and waits; the driver hands that
# to the drive as a homing run.
#
# HOME_LATCH_VEL does not move the motor.  It only moves LinuxCNC's internal
# command while it waits; srv-pos-fb follows that command during homing, so
# no following error builds up.  Keep it small.
#
# HOME_OFFSET is the joint position of the drive's zero (Z pulse + homeOffset).
# After homing the joint moves to HOME at HOME_FINAL_VEL.
# ---------------------------------------------------------------------------

[AXIS_X]
MIN_LIMIT        = -600
MAX_LIMIT        = 1
MAX_VELOCITY     = 200
MAX_ACCELERATION = 1000

[JOINT_0]
TYPE               = LINEAR
MAX_VELOCITY       = 200
MAX_ACCELERATION   = 1000
MIN_LIMIT          = -600
MAX_LIMIT          = 1
FERROR             = 5
MIN_FERROR         = 1
HOME_SEARCH_VEL    = 0
HOME_LATCH_VEL     = 1
HOME_USE_INDEX     = YES
HOME_FINAL_VEL     = 20
HOME_OFFSET        = 0
HOME               = 0
HOME_SEQUENCE      = 0
HOME_IGNORE_LIMITS = YES

[AXIS_Y]
MIN_LIMIT        = -600
MAX_LIMIT        = 1
MAX_VELOCITY     = 200
MAX_ACCELERATION = 1000

[JOINT_1]
TYPE               = LINEAR
MAX_VELOCITY       = 200
MAX_ACCELERATION   = 1000
MIN_LIMIT          = -600
MAX_LIMIT          = 1
FERROR             = 5
MIN_FERROR         = 1
HOME_SEARCH_VEL    = 0
HOME_LATCH_VEL     = 1
HOME_USE_INDEX     = YES
HOME_FINAL_VEL     = 20
HOME_OFFSET        = 0
HOME               = 0
HOME_SEQUENCE      = 1
HOME_IGNORE_LIMITS = YES
