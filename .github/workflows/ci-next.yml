---
name: CI (linuxcnc master)

# Weekly build of the dual-stack source against linuxcnc master (new HAL
# getter/setter API). The per-push CI in ci.yml builds against 2.9-era
# headers only; this job keeps the new-API side of lcec_hal_compat.h
# honest as master moves. Also runnable on demand.

on:
    schedule:
        - cron: '23 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-deb:
        name: ${{ matrix.distro }} (HAL next)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                distro: [debian-12, debian-13]
                include:
                    - distro: debian-12
                      image: debian:bookworm
                      codename: bookworm
                    - distro: debian-13
                      image: debian:trixie
                      codename: trixie

        container:
            image: ${{ matrix.image }}

        steps:
            - name: Install build dependencies
              env:
                  DEBIAN_FRONTEND: noninteractive
                  CODENAME: ${{ matrix.codename }}
              run: |
                  set -e
                  echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
                  echo 'Acquire::http::Timeout "30";' >> /etc/apt/apt.conf.d/80-retries
                  apt-get update
                  apt-get install -y --no-install-recommends ca-certificates curl gpg
                  curl -fsSL "https://linuxcnc-ethercat.github.io/apt/linuxcnc-ethercat-apt.gpg" \
                      -o /usr/share/keyrings/linuxcnc-ethercat-apt.gpg
                  echo "deb [signed-by=/usr/share/keyrings/linuxcnc-ethercat-apt.gpg] https://linuxcnc-ethercat.github.io/apt/ ${CODENAME} main" \
                      > /etc/apt/sources.list.d/linuxcnc-ethercat.list
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      git build-essential devscripts debhelper \
                      libethercat-dev libexpat1-dev yapps2

            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Mark repo as safe (container runs as root)
              run: git config --global --add safe.directory "$PWD"

            - name: Build and install linuxcnc master
              uses: ./.github/actions/linuxcnc-master-debs
              with:
                  codename: ${{ matrix.codename }}
                  distro: ${{ matrix.distro }}

            - name: Stamp CI version
              run: |
                  ver=$(git describe --tags --always | sed 's/^v//')
                  dch -b --newversion "${ver}+cinext" --distribution stable "CI build ${ver} (HAL next)"

            - name: Build deb package
              run: |
                  touch TODO
                  dpkg-buildpackage -d -us -uc -b
                  mkdir -p dist
                  for src in ../*.deb; do
                      [ -f "$src" ] || continue
                      case "$src" in *-dbgsym*) continue ;; esac
                      fname="$(basename "$src")"
                      base="${fname%_*.deb}"
                      suffix="${fname##*_}"
                      cp "$src" "dist/${base}_${{ matrix.distro }}_${suffix}"
                  done

            - name: Run tests
              run: |
                  cd src
                  make test

            - name: Upload deb artifact
              uses: actions/upload-artifact@v7
              with:
                  name: linuxcnc-ethercat-deb-next-${{ matrix.distro }}
                  path: dist/*.deb
                  if-no-files-found: error
