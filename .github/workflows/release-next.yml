---
name: Release (HAL next API)

# 2.x release line: built against linuxcnc master (new HAL getter/setter
# API). No public apt repository ships linuxcnc 2.10 debs yet, so the
# workflow builds linuxcnc master from source and compiles against it.
# dpkg-shlibdeps then derives Depends: linuxcnc-uspace (>= <built version>)
# automatically - that derived dependency IS the version gate separating
# the 2.x debs from 2.9-era systems, and it moves on its own when upstream
# tags the API-break version. v1.* tags keep building the legacy line via
# release.yml.
#
# workflow_dispatch builds the same debs with a ~wip version suffix so the
# pipeline can be exercised before the first v2.* tag exists.

on:
    push:
        tags: ['v2.*']
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: ${{ matrix.distro }} (HAL next)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # No bullseye: linuxcnc master needs newer toolchains than
                # Debian 11 provides.
                distro: [debian-12, debian-13]
                include:
                    - distro: debian-12
                      image: debian:bookworm
                      codename: bookworm
                      deb_rev: deb12u1
                    - distro: debian-13
                      image: debian:trixie
                      codename: trixie
                      deb_rev: deb13u1

        container:
            image: ${{ matrix.image }}

        steps:
            - name: Install build dependencies
              env:
                  DEBIAN_FRONTEND: noninteractive
                  CODENAME: ${{ matrix.codename }}
              run: |
                  set -e
                  echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
                  echo 'Acquire::http::Timeout "30";' >> /etc/apt/apt.conf.d/80-retries
                  apt-get update
                  apt-get install -y --no-install-recommends ca-certificates curl gpg
                  # EtherCAT (libethercat-dev) comes from our own apt repo
                  # instead of the OpenSUSE science:/EtherLab builds.
                  curl -fsSL "https://linuxcnc-ethercat.github.io/apt/linuxcnc-ethercat-apt.gpg" \
                      -o /usr/share/keyrings/linuxcnc-ethercat-apt.gpg
                  echo "deb [signed-by=/usr/share/keyrings/linuxcnc-ethercat-apt.gpg] https://linuxcnc-ethercat.github.io/apt/ ${CODENAME} main" \
                      > /etc/apt/sources.list.d/linuxcnc-ethercat.list
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      git build-essential devscripts debhelper \
                      libethercat-dev libexpat1-dev yapps2

            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Mark repo as safe (container runs as root)
              run: git config --global --add safe.directory "$PWD"

            - name: Build and install linuxcnc master
              uses: ./.github/actions/linuxcnc-master-debs
              with:
                  codename: ${{ matrix.codename }}
                  distro: ${{ matrix.distro }}

            - name: Stamp version with codename suffix
              run: |
                  # Version comes from the tag (v2.0.0 -> 2.0.0-1+deb13u1)
                  # so the 2.x line always sorts above 1.x in apt. Manual
                  # dispatch runs get a ~wip suffix that sorts below any
                  # real 2.x release.
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      new_ver="2.0.0~wip${{ github.run_number }}-1+${{ matrix.deb_rev }}"
                  else
                      new_ver="${GITHUB_REF_NAME#v}-1+${{ matrix.deb_rev }}"
                  fi
                  dch --newversion "${new_ver}" \
                      --distribution stable \
                      "HAL next API build ${GITHUB_REF_NAME} for ${{ matrix.codename }}"

            - name: Build deb package
              run: |
                  touch TODO
                  dpkg-buildpackage -d -us -uc -b
                  mkdir -p dist
                  for src in ../*.deb; do
                      [ -f "$src" ] || continue
                      case "$src" in *-dbgsym*) continue ;; esac
                      cp "$src" "dist/$(basename "$src")"
                  done

            - name: Run tests
              run: |
                  cd src
                  make test

            - name: Upload deb artifact
              uses: actions/upload-artifact@v7
              with:
                  name: linuxcnc-ethercat-deb-next-${{ matrix.distro }}
                  path: dist/*.deb
                  if-no-files-found: error

    release:
        name: Attach debs to GitHub release
        needs: build
        runs-on: ubuntu-latest
        # Manual dispatch runs only validate the pipeline; never create a
        # release or touch the apt repo from them.
        if: github.event_name == 'push'
        permissions:
            contents: write
        steps:
            - name: Download all artefacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts

            - name: List artefacts
              run: find artifacts -type f -name '*.deb' -print

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/**/*.deb
                  generate_release_notes: true
                  prerelease: ${{ contains(github.ref_name, '~pre') || contains(github.ref_name, '-pre') }}

            - name: Trigger apt-repo ingestion
              env:
                  GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "APT_DISPATCH_TOKEN not set; skipping ingestion dispatch."
                      exit 0
                  fi
                  # Safe to ingest: the shlibs-derived dependency on
                  # linuxcnc-uspace (>= 2.10~) is unsatisfiable from any
                  # current repository, so apt never offers these debs to
                  # 2.9-era systems.
                  gh api \
                      -X POST \
                      -H "Accept: application/vnd.github+json" \
                      /repos/linuxcnc-ethercat/apt/dispatches \
                      -f event_type=ingest-release \
                      -f "client_payload[source_repo]=${{ github.repository }}" \
                      -f "client_payload[tag]=${{ github.ref_name }}"
