---
name: Build CI

on:
    push:
        branches: ['**']
    pull_request:
    release:
        types: [published]
    workflow_dispatch:
    schedule:
        # Weekly, so the HAL-next side keeps tracking linuxcnc master even
        # when nothing pushes - a future upstream HAL break shows up here
        # first - and the linuxcnc 2.10 deb cache stays warm for per-push
        # runs.
        - cron: '23 4 * * 1'

permissions:
    contents: read

jobs:
    build-deb:
        name: ${{ matrix.distro }}${{ matrix.hal_api == 'next' && ' (HAL next)' || '' }}${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
        strategy:
            fail-fast: false
            matrix:
                distro: [debian-11, debian-12, debian-13]
                hal_api: [legacy, next]
                # arm64 runs on GitHub's native arm64 runners; the distro
                # container images are multi-arch and resolve to arm64
                # variants there.
                arch: [amd64, arm64]
                exclude:
                    # linuxcnc 2.10 needs a C++20 compiler; bullseye's
                    # gcc 10 fails configure. No bullseye system will ever
                    # run new-API linuxcnc, so a +getset deb is useless
                    # there - bullseye stays legacy-only.
                    - distro: debian-11
                      hal_api: next
                include:
                    # hal_api=legacy: 2.9-era HAL headers from the repos.
                    # hal_api=next: linuxcnc master built from source (new
                    # getter/setter API, 64-bit opaque handles since
                    # 2.10.0~pre2). Master is tracked on purpose: a red run
                    # here is the early warning that upstream broke the HAL
                    # API again. Releases build a pinned tag instead; see
                    # release.yml.
                    #
                    # linuxcnc_org_repo: build against linuxcnc.org's
                    # linuxcnc-uspace-dev instead of Debian main. Needed on
                    # bullseye (no linuxcnc in Debian 11) and bookworm (only
                    # a 2023 2.9.0~pre1 snapshot). Trixie builds against
                    # Debian's own 1:2.9.4 so the generated shlibs dep is
                    # installable on stock Debian without third-party repos.
                    - distro: debian-11
                      image: debian:bullseye
                      codename: bullseye
                      linuxcnc_org_repo: true
                    - distro: debian-12
                      image: debian:bookworm
                      codename: bookworm
                      linuxcnc_org_repo: true
                    - distro: debian-13
                      image: debian:trixie
                      codename: trixie
                      linuxcnc_org_repo: false

        container:
            image: ${{ matrix.image }}

        steps:
            - name: Install build dependencies
              env:
                  DEBIAN_FRONTEND: noninteractive
                  CODENAME: ${{ matrix.codename }}
                  LINUXCNC_ORG_REPO: ${{ matrix.linuxcnc_org_repo }}
                  HAL_API: ${{ matrix.hal_api }}
              run: |
                  set -e
                  if [ "${CODENAME}" = "bullseye" ]; then
                      # bullseye went EOL 2026-08-31 and the live mirrors
                      # (deb.debian.org AND security.debian.org) are dropping
                      # bullseye-security pool files one by one while the
                      # index still lists them. Pin the whole distro to the
                      # final pre-EOL snapshot instead. Check-Valid-Until:
                      # the frozen Release file is long expired.
                      cat > /etc/apt/sources.list <<'EOF'
                  deb http://snapshot.debian.org/archive/debian/20260831T000000Z bullseye main
                  deb http://snapshot.debian.org/archive/debian-security/20260831T000000Z bullseye-security main
                  deb http://snapshot.debian.org/archive/debian/20260831T000000Z bullseye-updates main
                  EOF
                      # Own conf file: 80-retries gets truncated below.
                      echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/90-no-valid-until
                  fi
                  echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
                  echo 'Acquire::http::Timeout "30";' >> /etc/apt/apt.conf.d/80-retries
                  apt-get update
                  apt-get install -y --no-install-recommends ca-certificates curl gpg
                  # EtherCAT (libethercat-dev) comes from our own apt repo
                  # instead of the OpenSUSE science:/EtherLab builds.
                  curl -fsSL "https://linuxcnc-ethercat.github.io/apt/linuxcnc-ethercat-apt.gpg" \
                      -o /usr/share/keyrings/linuxcnc-ethercat-apt.gpg
                  echo "deb [signed-by=/usr/share/keyrings/linuxcnc-ethercat-apt.gpg] https://linuxcnc-ethercat.github.io/apt/ ${CODENAME} main" \
                      > /etc/apt/sources.list.d/linuxcnc-ethercat.list
                  if [ "${HAL_API}" = "legacy" ] && [ "${LINUXCNC_ORG_REPO}" = "true" ]; then
                      # Two LinuxCNC signing keys are in use:
                      # - 3CB9FD148F374FEF: old DSA key, signs bullseye/bookworm
                      # - E43B5A8E78CC2927: 2025-10 RSA key, signs trixie
                      { curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xEEDD0D29F81DCAA0D258661F3CB9FD148F374FEF"; \
                        curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0CE3E44425B11F871BBCC6F5E43B5A8E78CC2927"; } \
                          | gpg --dearmor -o /usr/share/keyrings/linuxcnc.gpg
                      echo "deb [signed-by=/usr/share/keyrings/linuxcnc.gpg] https://www.linuxcnc.org/ ${CODENAME} base 2.9-uspace" \
                          > /etc/apt/sources.list.d/linuxcnc.list
                  fi
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      git build-essential devscripts debhelper \
                      libethercat-dev libexpat1-dev libfuse3-dev yapps2
                  if [ "${HAL_API}" = "legacy" ]; then
                      apt-get install -y --no-install-recommends linuxcnc-uspace-dev
                  fi

            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Mark repo as safe (container runs as root)
              run: git config --global --add safe.directory "$PWD"

            - name: Build and install linuxcnc 2.10
              if: matrix.hal_api == 'next'
              uses: ./.github/actions/linuxcnc-master-debs
              with:
                  codename: ${{ matrix.codename }}
                  distro: ${{ matrix.distro }}
                  arch: ${{ matrix.arch }}

            - name: Stamp CI version
              env:
                  HAL_API: ${{ matrix.hal_api }}
              run: |
                  # CI builds aren't published to the apt repo, so we just
                  # need a parseable version. Force-bump via -b to bypass
                  # dch's monotonic check (git describe on a feature branch
                  # often sorts below the canonical changelog version).
                  ver=$(git describe --tags --always | sed 's/^v//')
                  if [ "${HAL_API}" = "next" ]; then
                      ver=$(echo "${ver}" | sed 's/\(-\|$\)/+getset\1/')
                  fi
                  dch -b --newversion "${ver}+ci" --distribution stable "CI build ${ver} (${HAL_API} HAL)"

            - name: Build deb package
              run: |
                  dpkg-buildpackage -d -us -uc -b
                  mkdir -p dist
                  for src in ../*.deb; do
                      [ -f "$src" ] || continue
                      case "$src" in *-dbgsym*) continue ;; esac
                      fname="$(basename "$src")"
                      base="${fname%_*.deb}"
                      suffix="${fname##*_}"
                      cp "$src" "dist/${base}_${{ matrix.distro }}${{ matrix.hal_api == 'next' && '-next' || '' }}${{ matrix.arch == 'arm64' && '-arm64' || '' }}_${suffix}"
                  done


            - name: Verify CUSE serial support
              # The EL6001/EL6021 driver exposes its tty via CUSE, which
              # needs libfuse3 >= 3.12 at build time. bullseye ships 3.10
              # and legitimately builds without it; everywhere else a
              # missing libfuse3 NEEDED entry means the build silently
              # dropped the feature (e.g. libfuse3-dev not installed).
              # Fail loudly instead of shipping a half-baked package.
              if: matrix.distro != 'debian-11'
              run: |
                  if ! objdump -p src/lcec.so | grep -q 'NEEDED.*libfuse3'; then
                      echo "::error::lcec.so was built without CUSE support (libfuse3 >= 3.12 missing?)"
                      exit 1
                  fi

            - name: Run tests
              run: |
                  cd src
                  make test

            - name: Check ESI-generated headers are current
              run: ./scripts/check-generated-headers.sh

            - name: Upload deb artifact
              uses: actions/upload-artifact@v7
              with:
                  name: linuxcnc-ethercat-deb-${{ matrix.distro }}${{ matrix.hal_api == 'next' && '-next' || '' }}${{ matrix.arch == 'arm64' && '-arm64' || '' }}
                  path: dist/*.deb
                  if-no-files-found: error
